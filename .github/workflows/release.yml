name: Release

# Push a tag like v2.1.0 to build everything and publish a GitHub Release
# with the Switch NRO and the Windows build.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack the downloads
        run: |
          mkdir -p out
          cp artifacts/emerald-launcher-switch/emerald_launcher.nro out/
          (cd artifacts/emerald-launcher-windows && zip -qr ../../out/emerald-launcher-windows.zip .)
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/emerald_launcher.nro
            out/emerald-launcher-windows.zip
          generate_release_notes: true
